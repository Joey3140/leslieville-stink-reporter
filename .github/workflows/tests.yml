# `ci.py --write <project>` rewrites it from the project map. Runs on the BOSGAME runner (homeserver docs/github-runners.md).
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, bosgame]
    timeout-minutes: 30
    env:
      CI: "true"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tell Joey (ntfy) when main breaks
        if: failure() && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          [ -n "${NTFY_TOPIC:-}" ] || exit 0
          curl -s -m 10 -H "Title: CI failed: $REPO" -H "Priority: 3" -H "Tags: ci" -H "Click: $RUN_URL" \
            -d "Tests failed on main at ${GITHUB_SHA::7}: ${MSG%%$'\n'*}" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
