<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Unsubscribed</title>
</head>
<body style="margin:0;padding:0;background:#FAF7F2;font-family:Georgia,'Times New Roman',serif;color:#1B1B1B;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF7F2;padding:40px 20px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:white;border:1px solid #E8E2D7;border-radius:10px;padding:32px;">
                    <tr><td>
                        <h1 style="font-size:24px;line-height:1.2;margin:0 0 16px;">You're unsubscribed</h1>
                        <p style="font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5;color:#1B1B1B;margin:0 0 16px;">
                            We've removed your address from {{ fsasJoined }} alerts. The map at <a href="{{ baseUrl }}/" style="color:#1B1B1B;">{{ baseHost }}</a> is still public — drop in any time.
                        </p>
                        <p style="font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.5;color:#6B6764;margin:24px 0 0;">
                            Changed your mind? <a href="{{ baseUrl }}/subscribe" style="color:#6B6764;">Re-subscribe</a>.
                        </p>
                    </td></tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
